<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarif Raj — Graphic Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Chakra+Petch:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <section id="menu">
    <div class="stack" id="stack">
      <div class="zone"></div>
      <div id="sheets"></div>
      <h1 class="title" id="title">GRAPHIC DESIGN</h1>
      <div class="grabs" id="grabs"></div>
    </div>
    <div class="sig">
      <div class="name">Jarif Raj</div>
      <div class="hint">Click on a page to get started. There's only one here—for now...</div>
    </div>
    <button class="snd" id="snd" aria-pressed="true">SOUND ON</button>
  </section>

  <section id="project">
    <div class="sbar" id="sbar"><div class="sthumb" id="sthumb"></div></div>
    <div class="scroller" id="scroller"><div class="doc" id="doc"></div></div>
  </section>

  <div id="wipe"></div>
</div>

<script src="script.js"></script>
</body>
</html>
